<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYRVS - Account Settings</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #d4e5f5; 
            position: relative;
        }

        /* ===== SIDEBAR STYLING & COLLAPSE TRANSITION ===== */
        .sidebar {
           width: 300px;
            background-color: rgb(15, 143, 5); 
            color: #d4e5f5;
            padding: 20px 0;
            box-shadow: 4px 0 10px rgba(79, 217, 11, 0.1);
            transition: all 0.3s ease;
            overflow-x: hidden;
            flex-shrink: 0;
            z-index: 1000;
        }

        .sidebar.collapsed {
            width: 0;
            padding-left: 0;
            padding-right: 0;
            overflow: hidden;
            opacity: 0;
        }

        /* ===== TOGGLE BUTTON STYLING ===== */
        .sidebar-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background-color: rgb(15, 143, 5);
            color: #d4e5f5;
            border: none;
            padding: 10px 14px;
            font-size: 20px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s, opacity 0.3s ease, visibility 0.3s ease;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .sidebar-toggle-btn:hover {
            background-color: #2d6a4f;
        }

        body:not(.sidebar-collapsed) .sidebar-toggle-btn {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ===== STORE HEADER ===== */
        .store-header {
            display: flex;
            align-items: center;
            gap: 15px; 
            padding: 10px 20px 20px 20px;
            border-bottom: 1px solid rgba(23, 122, 6, 0.15);
            margin-bottom: 15px;
            white-space: nowrap;
        }

        .logo-img {
            width: 120px; 
            height: 120px;          
            object-fit: cover;    
            border-radius: 50%;
        }

        .store-name {
            font-family: 'Trebuchet MS', Arial, sans-serif;
            font-size: 40px;
            font-weight: bold;
            color: #e9f5ed;
        }

        /* ===== MENU GROUPS & ITEMS ===== */
        .menu-group {
            margin-bottom: 20px;
            white-space: nowrap;
        }

        .group-title {
            font-family: Georgia, serif;
            font-size: 23px;
            text-transform: uppercase;
            color: #041a3a; 
            padding: 10px 20px;
            letter-spacing: 1px;
        }

        .menu-item {
            display: block;
            color: #d8f3dc; 
            text-decoration: none;
            padding: 14px 20px;
            font-size: 24px; 
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .menu-item:hover {
            background-color: #2d6a4f; 
            color: #ffffff;
            padding-left: 25px; 
        }

        .menu-item.active {
            background-color: #40916c; 
            color: #ffffff;
            font-weight: bold;
            border-left: 5px solid #74c69d; 
        }

        .icon {
            margin-right: 10px;
            display: inline-block;
        }

        /* ===== MAIN CONTENT AREA ===== */
        .main-content {
            display: block;
            padding: 40px 20px;
            box-sizing: border-box;
            width: 100%;
            min-height: calc(100vh - 80px);
            transition: padding-left 0.3s ease;
        }

        .settings-container {    
            width: 100%;
            max-width: 650px;
            margin-left: 70px;    
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 25px;
        }

        body:not(.sidebar-collapsed) .main-content {
            margin-left: 90px;
        }

        .page-title {
            font-size: 38px;
            font-weight: bold;
            color: #041a3a;
            margin-bottom: -10px;
            letter-spacing: 0.5px;
            text-align: left;
            width: 100%;          
            max-width: 650px;     
        }

        /* Settings Card Form */
        .settings-card {
            width: 100%;          
            max-width: 650px;     
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid #cbd5e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .settings-header {
            background-color: #1a2b4c;
            color: #ffffff;
            padding: 18px 20px;
            text-align: center;
        }

        .settings-header h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .settings-body {
            padding: 30px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select {
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: #ffffff;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #155087;
        }

        /* Checkbox & Toggle Styles */
        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: rgb(15, 143, 5);
            cursor: pointer;
        }

        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-save {
            margin-top: 10px;
            background-color: rgb(15, 143, 5);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-save:hover {
            background-color: #2d6a4f;
        }

        .alert-success {
            display: none;
            background-color: #d8f3dc;
            color: #1b4332;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            border: 1px solid #74c69d;
        }

        @media (max-width: 768px) {
            .settings-container {
                margin-left: 0;
            }
        }
    </style>
</head>
<body class="sidebar-collapsed">
    <button id="sidebar-toggle" class="sidebar-toggle-btn">&#9776;</button>

    <!-- SIDEBAR -->
    <div class="sidebar collapsed" id="sidebar">
        <div class="store-header">
            <img src="logo.jpg" alt="Store Logo" class="logo-img">
            <span class="store-name">MYRVS</span>
        </div>
        
        <div class="menu-group">
            <div class="group-title">Main Navigation</div>
            <a href="Home.html" class="menu-item"><span class="icon">🏠</span> Home</a>
            <a href="Products.html" class="menu-item"><span class="icon">📦</span> Products</a>
            <a href="Categories.html" class="menu-item"><span class="icon">📁</span> Categories</a>
        </div>
        
        <div class="menu-group">
            <div class="group-title">Shopping</div>
            <a href="Cart.html" class="menu-item"><span class="icon">🛒</span> Cart</a>
            <a href="Orders.html" class="menu-item"><span class="icon">📋</span> My Orders</a>
            <a href="Wishlist.html" class="menu-item"><span class="icon">❤️</span> Wishlist</a>
        </div>
        
        <div class="menu-group">
            <div class="group-title">Account</div>
            <a href="Profile.html" class="menu-item"><span class="icon">👤</span> Profile</a>
            <a href="Setting.html" class="menu-item active"><span class="icon">⚙️</span> Settings</a>
        </div>
        
        <div class="menu-group">
            <div class="group-title">System</div>
            <a href="Logout.html" class="menu-item"><span class="icon">🚪</span> Logout</a>
        </div>
    </div>
    
     <!-- MAIN CONTENT AREA -->
    <div class="main-content">
        <div class="settings-container">
            <h1 class="page-title">⚙️ Settings</h1>

            <!-- Profile Settings Card -->
            <div class="settings-card">
                <div class="settings-header">
                    <h2>ACCOUNT SETTINGS</h2>
                </div>
                <div class="settings-body">
                    <div id="successAlert" class="alert-success">All settings saved successfully!</div>

                    <div class="form-group">
                        <label for="nameInput">NAME:</label>
                        <input type="text" id="nameInput" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="courseInput">COURSE/YR:</label>
                        <input type="text" id="courseInput" placeholder="e.g. BSIT - 2D">
                    </div>

                    <div class="form-group">
                        <label for="emailInput">EMAIL:</label>
                        <input type="email" id="emailInput" placeholder="Enter your email address">
                    </div>

                    <div class="form-group">
                        <label for="addressInput">ADDRESS:</label>
                        <input type="text" id="addressInput" placeholder="Enter your address">
                    </div>

                    <div class="form-group file-input-wrapper">
                        <label for="profilePicInput">PROFILE PICTURE:</label>
                        <input type="file" id="profilePicInput" accept="image/*">
                    </div>
                </div>
            </div>

            <!-- Notification Settings Card -->
            <div class="settings-card">
                <div class="settings-header">
                    <h2>NOTIFICATION SETTINGS</h2>
                </div>
                <div class="settings-body">
                    <label class="form-group checkbox-group">
                        <input type="checkbox" id="emailNotif"> Enable Email Notifications for Orders
                    </label>
                    <label class="form-group checkbox-group">
                        <input type="checkbox" id="smsNotif"> Enable SMS / Text Alerts
                    </label>
                    <label class="form-group checkbox-group">
                        <input type="checkbox" id="promoNotif"> Receive Promos & Special Offers
                    </label>
                </div>
            </div>

            <!-- Privacy Settings Card -->
            <div class="settings-card">
                <div class="settings-header">
                    <h2>PRIVACY SETTINGS</h2>
                </div>
                <div class="settings-body">
                    <div class="form-group">
                        <label for="profileVisibility">Profile Visibility:</label>
                        <select id="profileVisibility">
                            <option value="public">Public</option>
                            <option value="friends">Friends Only</option>
                            <option value="private">Private</option>
                        </select>
                    </div>
                    <label class="form-group checkbox-group">
                        <input type="checkbox" id="activityStatus"> Show Online Activity Status
                    </label>
                </div>

                <div style="padding: 0 30px 30px 30px; background: #f8fafc;">
                    <button type="button" id="saveBtn" class="btn-save">Save All Changes</button>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('sidebar-toggle');
            const sidebar = document.getElementById('sidebar');
            const body = document.body;

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                sidebar.classList.toggle('collapsed');
                body.classList.toggle('sidebar-collapsed');
            });

            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');

                    sidebar.classList.add('collapsed');
                    body.classList.add('sidebar-collapsed');
                });
            });

            document.addEventListener('click', (e) => {
                const isClickInsideSidebar = sidebar.contains(e.target);
                const isClickOnToggle = toggleBtn.contains(e.target);

                if (!body.classList.contains('sidebar-collapsed') && !isClickInsideSidebar && !isClickOnToggle) {
                    sidebar.classList.add('collapsed');
                    body.classList.add('sidebar-collapsed');
                }
            });

            // =========================================================================
            // [START FUNCTION 1]: LOAD EXISTING SETTINGS FROM LOCALSTORAGE INTO FORM FIELDS
            // =========================================================================
            const savedSettings = JSON.parse(localStorage.getItem('myrvs_settings'));
            if (savedSettings) {
                // Profile fields
                document.getElementById('nameInput').value = savedSettings.name || '';
                document.getElementById('courseInput').value = savedSettings.course || '';
                document.getElementById('emailInput').value = savedSettings.email || '';
                document.getElementById('addressInput').value = savedSettings.address || '';
                
                // Notification fields
                document.getElementById('emailNotif').checked = savedSettings.emailNotif ?? true;
                document.getElementById('smsNotif').checked = savedSettings.smsNotif ?? false;
                document.getElementById('promoNotif').checked = savedSettings.promoNotif ?? true;

                // Privacy fields
                document.getElementById('profileVisibility').value = savedSettings.profileVisibility || 'public';
                document.getElementById('activityStatus').checked = savedSettings.activityStatus ?? true;
            }
            // [END FUNCTION 1]


            // =========================================================================
            // [START FUNCTION 2]: SAVE ALL FORM INPUTS AND FILE UPLOADS TO LOCALSTORAGE
            // =========================================================================
            const saveBtn = document.getElementById('saveBtn');
            const successAlert = document.getElementById('successAlert');

            saveBtn.addEventListener('click', () => {
                // Gather form data values into an object
                const saveData = {
                    name: document.getElementById('nameInput').value,
                    course: document.getElementById('courseInput').value,
                    email: document.getElementById('emailInput').value,
                    address: document.getElementById('addressInput').value,
                    profilePic: savedSettings ? savedSettings.profilePic : '',
                    emailNotif: document.getElementById('emailNotif').checked,
                    smsNotif: document.getElementById('smsNotif').checked,
                    promoNotif: document.getElementById('promoNotif').checked,
                    profileVisibility: document.getElementById('profileVisibility').value,
                    activityStatus: document.getElementById('activityStatus').checked
                };

                const fileInput = document.getElementById('profilePicInput');

                // Process uploaded profile picture if selected
                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        saveData.profilePic = e.target.result; // convert image to Base64
                        localStorage.setItem('myrvs_settings', JSON.stringify(saveData));
                        triggerSuccessNotification(); // run success alert function
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    localStorage.setItem('myrvs_settings', JSON.stringify(saveData));
                    triggerSuccessNotification(); // run success alert function
                }
            });
            // [END FUNCTION 2]


            // =========================================================================
            // [START FUNCTION 3]: DISPLAY SUCCESS NOTIFICATION AND SCROLL TO TOP
            // =========================================================================
            function triggerSuccessNotification() {
                successAlert.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => {
                    successAlert.style.display = 'none';
                }, 3000);
            }
            // [END FUNCTION 3]

        });
    </script>
</body>
</html>
